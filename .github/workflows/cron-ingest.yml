name: Frequent Ingest

# Calls the production ingest endpoint on dealdossier.io every 15 minutes.
# Replaces the Vercel daily cron — moved here because (a) the Vercel
# Hobby plan caps cron resolution at daily, (b) frequent ingestion lets
# fresh deals reach watchlist users quickly instead of up to 24 hours,
# and (c) GitHub Actions's 6-hour job timeout is well beyond anything
# the ingest could ever need.
#
# The endpoint itself still runs on Vercel with all the secrets it
# needs (OpenRouter, Gmail IMAP, Supabase, Resend). This workflow only
# needs CRON_SECRET to authenticate the call.
#
# Manual trigger is enabled via workflow_dispatch — handy for ad-hoc
# runs or backfilling after a Vercel outage.

on:
  schedule:
    # GitHub heavily throttles scheduled jobs at :00 (every repo writes
    # '0 * * * *'), so runs can drift 15-60+ minutes or get skipped
    # entirely under load. Shifting off the top of the hour gets us
    # more reliable firings.
    - cron: '7,22,37,52 * * * *'  # every 15 minutes, shifted off hot :00/:15 marks
  workflow_dispatch:
    inputs:
      hours:
        description: 'Date-window lookback hours (blank = cursor mode)'
        required: false
        type: string
      limit:
        description: 'Emails per batch'
        required: false
        default: '20'
        type: string
      reprocess:
        description: 'Reprocess emails already seen this week for auditing'
        required: false
        default: false
        type: boolean
      offset:
        description: 'Starting offset for first batch'
        required: false
        default: '0'
        type: string
      batches:
        description: 'Number of sequential batches to run (e.g. 50 batches × 20 emails = 1000 emails)'
        required: false
        default: '1'
        type: string

jobs:
  ingest:
    runs-on: ubuntu-latest
    # For scheduled runs, one request consumes Vercel's full 5-minute window.
    # For backfill runs with many batches, allow up to 6 hours.
    timeout-minutes: 360
    concurrency:
      # Scheduled runs share a group to prevent overlap. Manual dispatch runs
      # each get their own group so they are never skipped by the queue limit.
      group: ${{ github.event_name == 'schedule' && 'hourly-ingest' || format('hourly-ingest-manual-{0}', github.run_id) }}
      cancel-in-progress: false
    steps:
      - name: Trigger ingest on dealdossier.io
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          INPUT_HOURS: ${{ inputs.hours }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_REPROCESS: ${{ inputs.reprocess }}
          INPUT_OFFSET: ${{ inputs.offset }}
          INPUT_BATCHES: ${{ inputs.batches }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not set in this repository."
            exit 1
          fi

          # Strip whitespace/newlines that GitHub Actions can inject when
          # substituting ${{ inputs.* }} values into the env block.
          INPUT_HOURS="${INPUT_HOURS//[$'\t\r\n ']}"
          INPUT_LIMIT="${INPUT_LIMIT//[$'\t\r\n ']}"
          INPUT_OFFSET="${INPUT_OFFSET//[$'\t\r\n ']}"
          INPUT_BATCHES="${INPUT_BATCHES//[$'\t\r\n ']}"

          limit="${INPUT_LIMIT:-20}"
          start_offset="${INPUT_OFFSET:-0}"
          batches="${INPUT_BATCHES:-1}"

          body_file=$(mktemp)
          trap 'rm -f "$body_file"' EXIT

          for batch in $(seq 0 $((batches - 1))); do
            current_offset=$((start_offset + batch * limit))

            ingest_url="https://dealdossier.io/api/cron/ingest?limit=${limit}&offset=${current_offset}"
            if [ -n "$INPUT_HOURS" ]; then
              ingest_url="${ingest_url}&hours=${INPUT_HOURS}"
            fi
            if [ "$INPUT_REPROCESS" = "true" ]; then
              ingest_url="${ingest_url}&reprocess=1"
            fi

            echo "--- Batch $((batch + 1))/${batches} (offset=${current_offset}) ---"

            for attempt in 1 2; do
              if ! status=$(curl -sS --max-time 320 \
                -o "$body_file" \
                -w "%{http_code}" \
                -H "Authorization: Bearer $CRON_SECRET" \
                "$ingest_url"); then
                status="000"
              fi

              echo "Attempt $attempt: HTTP $status"
              body=$(cat "$body_file")
              echo "Body: $body"

              if [ "$status" = "200" ]; then
                # If the endpoint returned 0 processed emails, the backlog is
                # cleared — no point running further batches.
                processed=$(echo "$body" | grep -o '"emails_processed":[0-9]*' | grep -o '[0-9]*' || echo "")
                if [ "$processed" = "0" ]; then
                  echo "No emails processed — backlog cleared, stopping early."
                  exit 0
                fi
                break
              fi

              if [ "$status" = "409" ]; then
                echo "Ingest is already running; skipping this scheduled tick."
                exit 0
              fi

              # Only retry on 502/503 (gateway errors where the function never
              # started). Do NOT retry 504 — the function already ran its full
              # 5-minute budget and may still be holding DB connections; a
              # fast retry hits an exhausted pool and fails with 500.
              if [ "$attempt" = "1" ] && { [ "$status" = "502" ] || [ "$status" = "503" ]; }; then
                echo "::warning::Transient ingest failure; retrying once in 10 seconds."
                sleep 10
                continue
              fi

              echo "::error::Ingest endpoint returned $status on batch $((batch + 1))"
              exit 1
            done

            # Brief pause between batches to let Supabase connections settle.
            if [ "$batch" -lt "$((batches - 1))" ]; then
              sleep 5
            fi
          done

          echo "All ${batches} batches completed."
