name: Hourly Ingest

# Calls the production ingest endpoint on dealdossier.io once an hour.
# Replaces the Vercel daily cron — moved here because (a) the Vercel
# Hobby plan caps cron resolution at daily, (b) hourly ingestion lets
# fresh deals reach watchlist users within an hour instead of up to 24,
# and (c) GitHub Actions's 6-hour job timeout is well beyond anything
# the ingest could ever need.
#
# The endpoint itself still runs on Vercel with all the secrets it
# needs (OpenAI, Gmail OAuth, Supabase, Resend). This workflow only
# needs CRON_SECRET to authenticate the call.
#
# Manual trigger is enabled via workflow_dispatch — handy for ad-hoc
# runs or backfilling after a Vercel outage.

on:
  schedule:
    # GitHub heavily throttles scheduled jobs at :00 (every repo writes
    # '0 * * * *'), so runs can drift 15-60+ minutes or get skipped
    # entirely under load. Shifting off the top of the hour gets us
    # more reliable firings.
    - cron: '17 * * * *'  # every hour at :17 past (UTC)
  workflow_dispatch:
    inputs:
      hours:
        description: 'Date-window lookback hours (blank = cursor mode)'
        required: false
        type: string
      limit:
        description: 'Maximum emails to process'
        required: false
        default: '20'
        type: string
      reprocess:
        description: 'Reprocess emails already seen this week for auditing'
        required: false
        default: false
        type: boolean
      offset:
        description: 'Backfill batch offset'
        required: false
        default: '0'
        type: string

jobs:
  ingest:
    runs-on: ubuntu-latest
    # One request may consume Vercel's full 5-minute function window. Leave
    # enough room for one retry, which quickly skips any emails the first
    # invocation already committed before timing out.
    timeout-minutes: 12
    concurrency:
      # Skip overlapping runs — if a previous hour's job is still going,
      # don't start a new one on top of it. The next hourly tick will
      # pick up where we left off (processed_emails table dedupes).
      group: hourly-ingest
      cancel-in-progress: false
    steps:
      - name: Trigger ingest on dealdossier.io
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          INPUT_HOURS: ${{ inputs.hours }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_REPROCESS: ${{ inputs.reprocess }}
          INPUT_OFFSET: ${{ inputs.offset }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not set in this repository."
            exit 1
          fi

          body_file=$(mktemp)
          trap 'rm -f "$body_file"' EXIT

          limit="${INPUT_LIMIT:-20}"
          ingest_url="https://dealdossier.io/api/cron/ingest?limit=${limit}"
          if [ -n "$INPUT_HOURS" ]; then
            ingest_url="${ingest_url}&hours=${INPUT_HOURS}"
          fi
          if [ "$INPUT_REPROCESS" = "true" ]; then
            ingest_url="${ingest_url}&reprocess=1"
          fi
          if [ -n "$INPUT_OFFSET" ] && [ "$INPUT_OFFSET" != "0" ]; then
            ingest_url="${ingest_url}&offset=${INPUT_OFFSET}"
          fi

          for attempt in 1 2; do
            # The default 60-email batch has crossed Vercel's 300-second
            # function limit. Twenty keeps the hourly run comfortably below
            # that ceiling while still prioritizing the newest messages.
            if ! status=$(curl -sS --max-time 320 \
              -o "$body_file" \
              -w "%{http_code}" \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$ingest_url"); then
              status="000"
            fi

            echo "Attempt $attempt: HTTP $status"
            echo "Body: $(cat "$body_file")"

            if [ "$status" = "200" ]; then
              exit 0
            fi

            if [ "$attempt" = "1" ] && { [ "$status" = "502" ] || [ "$status" = "503" ] || [ "$status" = "504" ]; }; then
              echo "::warning::Transient ingest failure; retrying once in 10 seconds."
              sleep 10
              continue
            fi

            echo "::error::Ingest endpoint returned $status"
            exit 1
          done
